    <!-- 🧠 Remember Name Across All Pages -->
    <script>
    // Load saved name when page opens
    let currentUsername = localStorage.getItem('siteUsername') || 'Guest';
    updateAllNameDisplays();
    
    function updateAllNameDisplays() {
        const displays = document.querySelectorAll('#userNameDisplay, #visitorName');
        displays.forEach(el => {
            if (el) el.textContent = currentUsername;
        });
    }
    
    function saveUsername(name) {
        currentUsername = name.trim() || 'Guest';
        localStorage.setItem('siteUsername', currentUsername);
        updateAllNameDisplays();
    }
    
    // If welcome screen exists and no name yet → show it
    window.addEventListener('load', function() {
        const welcomeScreen = document.getElementById('welcomeScreen');
        const savedName = localStorage.getItem('siteUsername');
        
        if (welcomeScreen && savedName) {
            // Skip welcome screen — go straight to content
            welcomeScreen.style.display = 'none';
            const mainContent = document.getElementById('mainContent');
            if (mainContent) {
                mainContent.style.opacity = '1';
                mainContent.style.pointerEvents = 'auto';
            }
        }
    });
    </script>
